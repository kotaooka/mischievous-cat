  }

  #ov { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; background: rgba(17, 22, 27, .72); border-radius: 10px; overflow: auto; padding: 8px; }

  .row { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }

  .btn.sub { background: transparent; color: var(--accent); }
  .btn:focus-visible, .cats button:focus-visible, #pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 下部の操作ボタン */
  #pad { display: flex; gap: 6px; margin: 8px 0 6px; }

  p.help { font-size: .78rem; margin: 3px 0; color: var(--ink2); }

<div id="wrap">

<script>
(() => {
'use strict';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 450, H = 540, FLOOR = 500, GRAV = 1400, JUMP = 580, SPEED = 150;
const DPR = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
cv.width = W * DPR; cv.height = H * DPR;
const FONT = '"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const SITE = 'https://kotaooka.github.io/mischievous-cat/';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[(Math.random() * a.length) | 0];
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const TAU = Math.PI * 2;

// ---------- 足場（上からだけ乗れる）----------
const PL = {
  floor: { x0: -20, x1: W + 20, y: FLOOR },
  side:  { x0: 20,  x1: 98,  y: 445 },   // サイドテーブル
  table: { x0: 125, x1: 300, y: 430 },   // テーブル
  shelf: { x0: 105, x1: 270, y: 355 },   // 壁の棚
  tower: { x0: 305, x1: 345, y: 440 },   // キャットタワー（上は安全地帯）
  book:  { x0: 345, x1: W - 2, y: 285 }  // 本棚（横からは入れない）
};
const PLS = Object.values(PL);
const BOX = { x: 215, w: 46, h: 46 };    // ダンボール（床で入ると隠れる）

// ---------- ネコ ----------
const CATS = [
  { id: 'kuro', name: '黒猫', note: '見つかりにくい', body: '#2b2b35', belly: '#3b3b48', eye: '#f2c94c', sus: 0.6, punch: 1, jump: 1, speed: 1, score: 1 },
  { id: 'cha', name: '茶トラ', note: 'パンチが強い', body: '#d98a3a', belly: '#f1c58c', stripe: '#a85f1c', eye: '#7bbf5a', sus: 1, punch: 1.35, jump: 1, speed: 1, score: 1 },
  { id: 'saba', name: 'サバトラ', note: 'バランス型', body: '#8e939c', belly: '#d9dce1', stripe: '#4a4f58', eye: '#d6b84a', sus: 1, punch: 1, jump: 1, speed: 1, score: 1 },
  { id: 'maine', name: 'メインクーン', note: '強パンチ・低ジャンプ', body: '#a8794a', belly: '#e0c9a6', stripe: '#6d4a2a', eye: '#d6b84a', sus: 1, punch: 1.5, jump: 0.85, speed: 0.95, score: 1, big: 1.18 },
  { id: 'mike', name: '三毛猫', note: 'スコア1.3倍', body: '#f4efe6', belly: '#ffffff', patch: [[-9, -22, 8, '#d98a3a'], [8, -14, 7, '#2b2b35'], [14, -30, 6, '#d98a3a'], [-16, -12, 5, '#2b2b35']], eye: '#7bbf5a', sus: 1, punch: 1, jump: 1, speed: 1, score: 1.3 }
];

// ---------- 壊れるもの ----------
const IT = {
  cup:     { n: 'コップ',       yen: 500,    pts: 100,  m: 1,   noise: 0.6, w: 14, h: 16, glass: true },
  mug:     { n: 'マグカップ',   yen: 1500,   pts: 150,  m: 2.4, noise: 0.8, w: 16, h: 16 },
  wine:    { n: 'ワイングラス', yen: 3000,   pts: 250,  m: 1.1, noise: 1.0, w: 14, h: 28, glass: true },
  vase:    { n: '花瓶',         yen: 10000,  pts: 500,  m: 2,   noise: 1.6, w: 20, h: 32 },
  phone:   { n: 'スマホ',       yen: 120000, pts: 1000, m: 0.7, noise: 0.5, w: 12, h: 24 },
  tablet:  { n: 'タブレット',   yen: 80000,  pts: 800,  m: 1.3, noise: 0.6, w: 28, h: 20 },
  console: { n: 'ゲーム機',     yen: 45000,  pts: 600,  m: 2,   noise: 0.8, w: 32, h: 12 },
  tissue:  { n: 'ティッシュ箱', yen: 300,    pts: 60,   m: 0.8, noise: 0.3, w: 26, h: 16 },
  pens:    { n: 'ペン立て',     yen: 800,    pts: 80,   m: 1,   noise: 0.4, w: 16, h: 20 }
};
// どの足場に置けるか。{ 足場: [x の範囲] }
const SPOT = { side: [30, 90], table: [145, 285], shelf: [125, 255], book: [356, 402] };
const ON = {
  cup: ['side', 'table'], mug: ['table', 'shelf'], wine: ['table', 'shelf'], vase: ['shelf', 'book'],
  phone: ['side', 'table', 'shelf'], tablet: ['table', 'shelf', 'book'], console: ['table', 'book'],
  tissue: ['side', 'table'], pens: ['side', 'table', 'book']
};

// ---------- 飼い主のモード ----------
const MODE = {
  away:   { range: 0,   rate: 0 },
  walk:   { range: 230, rate: 28 },
  leave:  { range: 230, rate: 28 },
  warn:   { range: 600, rate: 8 },
  look:   { range: 600, rate: 60 },
  up:     { range: 600, rate: 60 },
  phone:  { range: 100, rate: 10, omni: true },
  search: { range: 600, rate: 70 }
};

// ---------- 状態 ----------
let state = 'title', level = 1, sus = 0, muted = false, selCat = 0, bestYen = 0;
let stageT = 0, clearT = 0, caughtT = 0, shake = 0, tAnim = 0, susCd = 0;
try { muted = localStorage.getItem('nekoMute') === '1'; bestYen = +localStorage.getItem('nekoBestYen') || 0; selCat = clamp((+localStorage.getItem('nekoCat')) | 0, 0, CATS.length - 1); } catch (e) {}
let run, cat, items = [], puddles = [], prints = [], parts = [], pops = [], vac = null, dog = null, newRec = false;
const keys = { L: false, R: false };
const owner = { x: -60, face: 1, mode: 'away', t: 3, range: 0, rate: 0, omni: false, stops: [], si: 0, gx: 0, spd: 70, lureT: 0, say: '', sayT: 0, warned: false, hint: null, phoneLeft: 0, upIn: 0, searchRetarget: 0, up: false, step: 0 };

// ---------- 音 ----------
let ac = null, nbuf = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f1, f2, d, type, vol, delay) {
  if (muted) return; const a = audio(); if (!a) return;
  const o = a.createOscillator(), gn = a.createGain(), t = a.currentTime + (delay || 0);
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
  gn.gain.setValueAtTime(vol || 0.1, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function hiss(d, vol, hp) {
  if (muted) return; const a = audio(); if (!a) return;
  if (!nbuf) { nbuf = a.createBuffer(1, a.sampleRate * 0.5, a.sampleRate); const ch = nbuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain(), t = a.currentTime;
  s.buffer = nbuf; f.type = 'highpass'; f.frequency.value = hp || 1000;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(gn); gn.connect(a.destination); s.start(t); s.stop(t + d);
}
const sfx = {
  jump: () => tone(300, 620, 0.12, 'square', 0.04),
  meow: () => { tone(700, 950, 0.14, 'triangle', 0.1); tone(950, 480, 0.4, 'triangle', 0.1, 0.12); },
  weak: () => hiss(0.05, 0.05, 2500),
  strong: () => { tone(140, 50, 0.14, 'sine', 0.2); hiss(0.1, 0.09, 600); },
  glass: v => { hiss(0.3, 0.1 + 0.08 * v, 3000); tone(2600, 900, 0.22, 'triangle', 0.04 * v); },
  thud: () => tone(110, 40, 0.2, 'sine', 0.22),
  splash: () => hiss(0.3, 0.09, 700),
  alert: () => tone(880, 880, 0.1, 'square', 0.05),
  steps: () => { tone(90, 60, 0.1, 'sine', 0.14); tone(90, 60, 0.1, 'sine', 0.14, 0.28); tone(90, 60, 0.1, 'sine', 0.14, 0.56); },
  bark: () => { tone(320, 180, 0.12, 'sawtooth', 0.12); tone(320, 180, 0.12, 'sawtooth', 0.12, 0.2); },
  bump: () => tone(200, 70, 0.18, 'square', 0.08),
  caught: () => tone(520, 90, 0.7, 'sawtooth', 0.12),
  clear: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.09, i * 0.1)); }
};

// ---------- ステージ ----------
function setupStage(L) {
  level = L; stageT = 0;
  items = []; puddles = []; prints = []; parts = []; pops = [];
  const avail = ['side', 'table']; if (L >= 2) avail.push('shelf'); if (L >= 3) avail.push('book');
  const pool = ['cup', 'cup', 'mug', 'tissue'];
  if (L >= 2) pool.push('pens', 'wine', 'cup'); if (L >= 3) pool.push('phone', 'vase'); if (L >= 4) pool.push('tablet', 'vase'); if (L >= 5) pool.push('console', 'phone');
  const n = Math.min(2 + L, 8);
  for (let k = 0, guard = 0; items.length < n && guard < 200; guard++) {
    const t = pick(pool);
    const ok = ON[t].filter(s => avail.includes(s)); if (!ok.length) continue;
    const s = pick(ok), r = SPOT[s], x = rnd(r[0], r[1]);
    if (items.some(o => o.plat === PL[s] && Math.abs(o.x - x) < 34)) continue;
    items.push({ t, x, y: PL[s].y, vx: 0, vy: 0, plat: PL[s], state: 'rest', rot: 0, vr: 0, y0: 0, water: t === 'cup' && Math.random() < 0.35 });
  }
  const T = CATS[selCat];
  cat = cat || {};
  Object.assign(cat, { type: T, x: 255, y: FLOOR, vx: 0, vy: 0, face: 1, plat: PL.floor, coyote: 0, jumpBuf: 0, pDown: false, pHeld: 0, punchT: 0, strong: false, punchCd: 0, meowT: 0, meowCd: 0, stun: 0, wet: 0, printT: 0, hidden: false, safe: false, acting: false, anim: 0 });
  owner.mode = 'away'; owner.t = L === 1 ? 5 : rnd(2.5, 4.5); owner.range = 0; owner.lureT = 0; owner.warned = false; owner.hint = null; owner.say = ''; owner.x = -60;
  sus = Math.min(sus, 25);
  dog = L >= 4 ? { x: 60, alertT: 0, cd: 0, barkT: 0 } : null;
  vac = L >= 3 ? { x: rnd(160, 300), dir: pick([-1, 1]), t: rnd(3, 6), cd: 0 } : null;
}
function newRun() {
  run = { yen: 0, score: 0, stage: 1, broke: {}, prints: 0, water: 0, idle: false, comment: '' };
  sus = 0; setupStage(1);
}

// ---------- 飼い主 ----------
const awayRange = L => [Math.max(2.2, 5.5 - 0.35 * L), Math.max(4, 8.5 - 0.5 * L)];

function setMode(m, t) {

}
function ownerSees(x) {
  const o = owner; if (o.mode === 'away') return false;

}
function say(text, t) { owner.say = text; owner.sayT = t || 1.6; }
function newPlan(hint) {
  const stops = [];

  const n = level >= 4 ? 3 : 2;
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    const kind = i === 0 ? 'check' : (level >= 2 && r < 0.45 ? 'phone' : (r < 0.7 ? 'shelf' : 'check'));

}
function enter() {
  owner.x = -40; owner.face = 1; owner.spd = walkSpeed(level); owner.up = false;
  newPlan(owner.hint); owner.hint = null; nextStop();
}
function nextStop() {
  owner.up = false;
  if (owner.si < owner.stops.length) { const s = owner.stops[owner.si++]; owner.gx = s.x; owner.cur = s; setMode('walk'); }
  else setMode('leave');
}
function goAway() { const r = awayRange(level); setMode('away', rnd(r[0], r[1])); owner.warned = false; }
function arrive() {

  } else {

}
function startSearch() {

  owner.lureT = 0; owner.up = false; setMode('search', 7);

  say('なんかおかしいな？', 2.2); sfx.alert();
}
function rush(x) {
  const o = owner;

  if (o.mode === 'search') return;
  o.stops.splice(o.si, 0, { kind: 'check', x: clamp(x, 40, 330), quick: true });

}
function noise(x, loud) {
  const o = owner;

  if (ownerSees(x)) sus += 40 * loud;

function meow() {

function updOwner(dt) {

    case 'leave': o.face = -1; o.x -= o.spd * 1.3 * dt; o.step += dt; if (o.x < -50) goAway(); break;
    case 'warn': o.t -= dt; if (o.t <= 0) setMode('look', lookTime(level)); break;

      if (Math.abs(o.gx - o.x) > 6) step(o.gx, o.spd * 1.3); else if (o.faceWant) o.face = o.faceWant;
      if (o.t <= 0) { sus = Math.min(sus, 45); setMode('leave'); }

}

// ---------- ネコ ----------
function updCat(dt) {

    c.vy = -JUMP * T.jump; c.plat = null; c.coyote = 0; c.jumpBuf = 0; sfx.jump();
  }
  if (c.plat) {
    if (c.x < c.plat.x0 - 4 || c.x > c.plat.x1 + 4) { c.plat = null; c.vy = 0; c.coyote = 0.1; }
  }

    const py = c.y; c.vy += GRAV * dt; c.y += c.vy * dt;

function dogBark() {
  if (!dog) return;
  dog.barkT = 0.7; dog.cd = 7; dog.alertT = 0; sfx.bark(); sus += 12; rush(cat.x); say('どうした？', 1.4);
}
function updDog(dt) {
  if (!dog) return;
  if (dog.cd > 0) dog.cd -= dt; if (dog.barkT > 0) dog.barkT -= dt;
  const near = cat.plat === PL.floor && Math.abs(cat.x - dog.x) < 60 && Math.abs(cat.vx) > 20;
  if (near) dog.alertT += dt; else dog.alertT = Math.max(0, dog.alertT - dt);
  if (dog.alertT > 0.6 && dog.cd <= 0) dogBark();
}
function updVac(dt) {
  if (!vac) return;
  if (vac.cd > 0) vac.cd -= dt;
  vac.x += vac.dir * 38 * dt; vac.t -= dt;
  if (vac.x < 30) { vac.x = 30; vac.dir = 1; } else if (vac.x > 335) { vac.x = 335; vac.dir = -1; }
  if (vac.t <= 0) { vac.dir = Math.random() < 0.5 ? -1 : 1; vac.t = rnd(3, 6); }
  if (vac.cd <= 0 && cat.stun <= 0 && cat.y > FLOOR - 14 && Math.abs(cat.x - vac.x) < 30) {
    cat.stun = 0.9; cat.vx = (cat.x >= vac.x ? 1 : -1) * 200; vac.cd = 1.6; sfx.bump(); sus += 18; noise(cat.x, 0.5);
  }
}
function updSus(dt) {
  const o = owner;
  let seen = false;
  if (o.mode !== 'away' && !cat.hidden && !cat.safe) seen = ownerSees(cat.x);
  let rate = o.rate; if (o.mode === 'up' && o.t > 0.5) rate = 8;
  let gain = 0;
  if (seen && cat.acting) gain += rate * cat.type.sus;
  if (o.mode !== 'away') {
    for (const it of items) if (it.state !== 'rest' && ownerSees(it.x)) { gain += rate * 0.7; break; }
    if (rate >= 60 || o.mode === 'walk') { let n = 0; for (const p of prints) if (ownerSees(p.x) && ++n <= 5) gain += 2.5; }

  state = 'caught'; caughtT = 1.5; run.idle = !cat.acting; shake = 0.4; sfx.caught();
  if (owner.mode === 'away') { owner.x = clamp(cat.x - 70, 20, 330); owner.face = 1; }

// ---------- 結果 ----------
function titleOf(y) { return y < 10000 ? '見習いネコ' : y < 60000 ? '食器破壊職人' : y < 200000 ? 'キッチンの悪夢' : y < 500000 ? 'リビング崩壊請負猫' : '伝説の食器破壊者'; }
function commentOf() {
  const b = run.broke, c = [];
  if (run.idle) c.push('犯人が堂々と寝てる');
  if (run.prints >= 3 && run.water > 0) c.push('また足跡残してる');
  if ((b.cup || 0) >= 3) c.push('コップ全部なくなってるんだけど？');
  if (run.yen >= 200000) c.push('もう紙コップにします');
  if (b.phone) c.push('スマホの画面、見たくない');
  if (b.vase) c.push('その花瓶、もらいものだったんだけど');
  if (run.water > 0) c.push('床がびしょびしょなんだけど');
  if (run.yen < 10000) c.push('まあ、これくらいなら許せる');

}

  state = 'over';
  run.stage = level; run.comment = commentOf();
  newRec = run.yen > bestYen;
  if (newRec) { bestYen = run.yen; try { localStorage.setItem('nekoBestYen', String(bestYen)); } catch (e) {} }

// ---------- 描画：ネコ・もの ----------

}

  c.beginPath(); c.moveTo(21, -38); c.lineTo(27, -47); c.lineTo(30, -33); c.closePath(); c.fill();

  if (T.patch) { c.fillStyle = '#d98a3a'; c.beginPath(); c.arc(15, -32, 5, 0, TAU); c.fill(); c.fillStyle = '#2b2b35'; c.beginPath(); c.arc(26, -24, 3.5, 0, TAU); c.fill(); }
  // 顔
  if (pose === 'smug') {

    c.beginPath(); c.arc(25, -29, 3, Math.PI * 0.1, Math.PI * 0.9); c.stroke();

  drawFurniture();
  drawPuddles();
  for (const it of items) drawItem(g, it.t, it.x, it.state === 'fall' ? it.y : it.plat.y, it.rot, it.water);
  drawVac();
  drawCatNow();
  drawBox();
  drawBark();
  drawParts();
  // 足音の予告
  if (state === 'play' && owner.mode === 'away' && owner.t < 1.1 && owner.t > 0) {
    g.fillStyle = 'rgba(30,30,40,.75)'; g.font = `bold 15px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    g.fillText('▶ ドタドタ', 8 + Math.sin(tAnim * 12) * 3, FLOOR - 70);
  }
  // ステージ表示
  g.textBaseline = 'alphabetic';
  g.fillStyle = 'rgba(40,30,20,.75)'; g.font = `bold 14px ${FONT}`; g.textAlign = 'left'; g.fillText('ステージ' + level, 10, 22);
  g.textAlign = 'right'; g.fillText('残り' + items.length + '個', W - 10, 22);
  if (state === 'clear') {
    g.fillStyle = 'rgba(21,33,44,.72)'; rr(g, 60, 200, W - 120, 90, 12); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.font = `bold 28px ${FONT}`; g.fillText('ステージクリア', W / 2, 242);
    g.font = `bold 16px ${FONT}`; g.fillText('本日の被害額 ' + yen(run.yen), W / 2, 272);
  }
  g.restore();
}

// ---------- 更新 ----------
function update(dt) {
  tAnim += dt; if (shake > 0) shake -= dt;
  if (state === 'play') {
    stageT += dt; updCat(dt); updOwner(dt); updItems(dt); updDog(dt); updVac(dt); updSus(dt); checkClear();
  } else if (state === 'clear') {
    updCat(dt); updItems(dt); clearT -= dt;
    if (clearT <= 0) { setupStage(level + 1); state = 'play'; }
  } else if (state === 'caught') {
    caughtT -= dt; if (caughtT <= 0) gameOver();
  } else {
    cat.anim += dt;
  }
  updParts(dt);
}

// ---------- 画面（HUD・タイトル・結果）----------
const $ = id => document.getElementById(id);
const hS = $('hS'), hY = $('hY'), hB = $('hB'), ov = $('ov');
let lastHud = '';
function hud() {
  const s = run ? run.score.toLocaleString('ja-JP') : '0', y = run ? yen(run.yen) : '¥0', b = Math.round(sus);
  const key = s + '|' + y + '|' + b; if (key === lastHud) return; lastHud = key;
  hS.textContent = s; hY.textContent = y; hB.style.width = b + '%';
  hB.style.background = b >= 70 ? 'var(--danger)' : b >= 40 ? 'var(--warn)' : 'var(--accent)';
}
function showTitle() {
  state = 'title'; newRun(); ov.hidden = false;
  ov.innerHTML = `<div class="panel">
    <h1>こっそりネコ</h1>
    <p>家中でいたずらをして、本日の被害額を稼ぎます。飼い主に見つかるとゲームオーバーです。</p>
    <div class="cats" role="group" aria-label="ネコを選ぶ">${CATS.map((c, i) => `<button type="button" data-i="${i}" aria-pressed="${i === selCat}"><canvas width="144" height="108"></canvas><b>${c.name}</b><span>${c.note}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="goBtn" type="button">はじめる</button></div>
    <ul class="how">
      <li>飼い主の「？」は予告、「!!」は監視中です。見られている間は止まります</li>
      <li>ジャンプでテーブル、棚、本棚へ登れます。長押しの強パンチは重いものも飛ばせますが、音が出ます</li>
      <li>「鳴く」と飼い主はネコが向いている側を見ます。その隙に反対側で落とします</li>
      <li>ダンボールの中とキャットタワーの上は見つかりません。お掃除ロボと犬には近づかないでください</li>
    </ul>
    <p>ベスト被害額　${yen(bestYen)}</p></div>`;
  ov.querySelectorAll('.cats canvas').forEach((cn, i) => { const c2 = cn.getContext('2d'); c2.scale(2, 2); drawCat(c2, 34, 49, { type: CATS[i], face: 1, scale: 0.8, t: 0, pose: 'walk' }); });
  ov.querySelectorAll('.cats button').forEach(b => b.addEventListener('click', () => {
    selCat = +b.dataset.i; try { localStorage.setItem('nekoCat', String(selCat)); } catch (e) {}
    ov.querySelectorAll('.cats button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); setupStage(1);
  }));
  $('goBtn').addEventListener('click', () => { audio(); startGame(); });
}
function startGame() { ov.hidden = true; newRun(); state = 'play'; }
let cardBlob = null, cardUrl = null;
function shareText() { return `本日の被害額 ${yen(run.yen)}\nステージ${run.stage}　称号：${titleOf(run.yen)}\n「${run.comment}」\n#MischievousCat #こっそりネコ`; }
async function showOver() {
  const ttl = titleOf(run.yen), xUrl = 'https://x.com/intent/post?text=' + encodeURIComponent(shareText()) + '&url=' + encodeURIComponent(SITE);
  ov.hidden = false;
  ov.innerHTML = `<div class="panel">
    <p class="k">本日の被害額</p><p class="big">${yen(run.yen)}</p>
    <p class="meta">ステージ${run.stage}　称号：<b>${ttl}</b>　スコア${run.score.toLocaleString('ja-JP')}</p>
    <p class="cm">「${run.comment}」</p>${newRec ? '<p class="rec">ベスト被害額を更新しました</p>' : ''}
    <img id="card" alt="シェア用の画像" width="1200" height="630">
    <div class="row"><button class="btn" id="bShare" type="button">シェア</button><button class="btn sub" id="bSave" type="button">画像を保存</button><a class="btn sub" id="bX" href="${xUrl}" target="_blank" rel="noopener">Xに投稿</a></div>
    <div class="row"><button class="btn" id="bAgain" type="button">もう一度</button><button class="btn sub" id="bChange" type="button">ネコを選ぶ</button></div></div>`;
  $('bAgain').addEventListener('click', () => { audio(); startGame(); });
  $('bChange').addEventListener('click', showTitle);
  $('bShare').addEventListener('click', doShare);
  $('bSave').addEventListener('click', saveCard);
  cardBlob = null;
  try {
    const cn = await makeCard();
    cardBlob = await new Promise(r => cn.toBlob(r, 'image/png'));
    if (cardUrl) URL.revokeObjectURL(cardUrl);
    cardUrl = URL.createObjectURL(cardBlob);
    const im = $('card'); if (im) im.src = cardUrl;
  } catch (e) { /* 画像を作れない環境ではテキストだけ共有する */ }
}
async function doShare() {
  const text = shareText();
  try {
    if (cardBlob && navigator.canShare) {
      const file = new File([cardBlob], 'mischievous-cat.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + '\n' + SITE }); return; }
    }
    if (navigator.share) { await navigator.share({ text, url: SITE }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  window.open('https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SITE), '_blank', 'noopener');
}
function saveCard() {
  if (!cardUrl) return;
  const a = document.createElement('a'); a.href = cardUrl; a.download = 'mischievous-cat-' + Math.round(run.yen) + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}
async function makeCard() {
  try { await document.fonts.load('700 40px "BIZ UDPGothic"'); } catch (e) {}
  const cn = document.createElement('canvas'); cn.width = 1200; cn.height = 630;
  const c = cn.getContext('2d'), T = CATS[selCat];
  const wall = c.createLinearGradient(0, 0, 0, 630); wall.addColorStop(0, '#f3e6d0'); wall.addColorStop(1, '#e6d4b6');
  c.fillStyle = wall; c.fillRect(0, 0, 1200, 630);
  c.fillStyle = '#c99c68'; c.fillRect(0, 500, 1200, 130); c.fillStyle = 'rgba(0,0,0,.08)'; c.fillRect(0, 500, 1200, 5);
  // 水たまりと割れたコップ
  c.fillStyle = 'rgba(95,165,225,.6)'; c.beginPath(); c.ellipse(840, 565, 190, 26, 0, 0, TAU); c.fill();
  c.fillStyle = 'rgba(255,255,255,.45)'; c.beginPath(); c.ellipse(780, 558, 50, 8, 0, 0, TAU); c.fill();
  const shards = [[640, 545, 14, 0.5], [700, 590, 11, 2], [980, 548, 13, 4], [1040, 585, 10, 1], [930, 600, 12, 3], [760, 530, 9, 5], [1090, 540, 11, 2.5]];
  shards.forEach(s => { c.save(); c.translate(s[0], s[1]); c.rotate(s[3]); c.fillStyle = '#f5f7fa'; c.strokeStyle = 'rgba(0,0,0,.3)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-s[2], s[2] * .5); c.lineTo(s[2], 0); c.lineTo(0, -s[2]); c.closePath(); c.fill(); c.stroke(); c.restore(); });
  c.save(); c.translate(1000, 560); c.rotate(1.4); c.scale(3, 3); drawItem(c, 'cup', 0, 0, 0, false); c.restore();
  // ドヤ顔のネコ
  drawCat(c, 880, 520, { type: T, face: 1, scale: 6.2, t: 0.6, pose: 'smug' });
  // 文字
  const dark = '#15212c', mid = '#475563';
  c.textBaseline = 'alphabetic'; c.textAlign = 'left';
  c.fillStyle = '#1d5c96'; c.font = `700 40px ${FONT}`; c.fillText('Mischievous Cat', 60, 82);
  c.fillStyle = mid; c.font = `700 26px ${FONT}`; c.fillText('こっそりネコ', 60, 118);
  c.fillStyle = mid; c.font = `700 30px ${FONT}`; c.fillText('本日の被害額', 60, 190);
  const ys = yen(run.yen); let fs = 112; c.font = `700 ${fs}px ${FONT}`;
  while (c.measureText(ys).width > 640 && fs > 50) { fs -= 4; c.font = `700 ${fs}px ${FONT}`; }
  c.fillStyle = dark; c.fillText(ys, 56, 190 + 20 + fs * 0.85);
  const y2 = 190 + 20 + fs * 0.85 + 50;
  c.fillStyle = mid; c.font = `700 30px ${FONT}`; c.fillText('ステージ' + run.stage, 60, y2);
  c.fillStyle = dark; c.font = `700 38px ${FONT}`; c.fillText(titleOf(run.yen), 60, y2 + 52);
  // 飼い主コメント
  const q = '「' + run.comment + '」', bx = 60, by = 446, bw = 620, bh = 96;
  c.fillStyle = 'rgba(255,255,255,.92)'; rr(c, bx, by, bw, bh, 16); c.fill(); c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 2; c.stroke();
  c.fillStyle = mid; c.font = `700 20px ${FONT}`; c.fillText('飼い主コメント', bx + 22, by + 30);
  let qs = 32; c.font = `700 ${qs}px ${FONT}`; while (c.measureText(q).width > bw - 44 && qs > 18) { qs -= 2; c.font = `700 ${qs}px ${FONT}`; }
  c.fillStyle = dark; c.fillText(q, bx + 22, by + 72);
  c.fillStyle = mid; c.font = `700 22px ${FONT}`; c.fillText('#MischievousCat　#こっそりネコ', 60, 584);
  c.textAlign = 'right'; c.fillText('kotaooka.github.io/mischievous-cat', 1160, 40);
  return cn;
}

// ---------- 入力 ----------
function jumpPress() { if (state === 'play' || state === 'clear') cat.jumpBuf = 0.12; }
function punchDown() { if (state !== 'play' || cat.pDown) return; cat.pDown = true; cat.pHeld = 0; }
function punchUp() { if (!cat.pDown) return; cat.pDown = false; if (state === 'play') cat.punchReq = cat.pHeld >= 0.35; cat.pHeld = 0; }
function hold(id, on, off) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} audio(); b.classList.add('act'); on(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, () => { b.classList.remove('act'); off(); }));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
hold('bL', () => { keys.L = true; }, () => { keys.L = false; });
hold('bR', () => { keys.R = true; }, () => { keys.R = false; });
hold('bJ', jumpPress, () => {});
hold('bP', punchDown, punchUp);
hold('bM', () => { if (state === 'play') meow(); }, () => {});
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.L = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.R = true;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') { if (!e.repeat) jumpPress(); }
  else if (k === ' ' || k === 'z' || k === 'Z') { if (state === 'play') { if (!e.repeat) { audio(); punchDown(); } } else return; }
  else if (k === 'x' || k === 'X') { if (!e.repeat && state === 'play') meow(); }
  else if (k === 'm' || k === 'M') { toggleSound(); }
  else return;
  if (state === 'play' || state === 'clear') e.preventDefault();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.L = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.R = false;
  else if (k === ' ' || k === 'z' || k === 'Z') punchUp();
});
function toggleSound() { muted = !muted; try { localStorage.setItem('nekoMute', muted ? '1' : '0'); } catch (e) {} soundLabel(); }
function soundLabel() { const b = $('bSnd'); b.textContent = muted ? '音：OFF' : '音：ON'; b.setAttribute('aria-pressed', String(!muted)); }
$('bSnd').addEventListener('click', () => { toggleSound(); if (!muted) audio(); });
soundLabel();
window.addEventListener('blur', () => { keys.L = keys.R = false; punchUp(); });

// ---------- ループ ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw(); hud();
  requestAnimationFrame(frame);
}
showTitle();
requestAnimationFrame(frame);
})();
</script>
