<style>
  @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/mplus-rounded-500.woff2") format("woff2"); }

  :root {

  }
  * { box-sizing: border-box; }
  /* 画面いっぱいに表示する（ページはスクロールしない） */

  }
  #top, #meter, #pad { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; flex: none; }

  /* 上段：ロゴ・スコア・被害額・音 */
  #top { display: flex; align-items: center; gap: 6px; }

  #bSnd, #bPause { width: 38px; height: 34px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }

  #meter .bar { flex: 1; height: 19px; background: #f6e2c4; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
  #meter .bar i { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: background .2s; }
  /* 怪しまれ度は色だけでなく、言葉・しま模様・目の開き具合でも段階を示す */
  #meter.l5 .lvl { background: #4a2f1d; color: #fff; animation: lvb .4s steps(2) infinite; }
  #meter.l5 .bar { border-color: #4a2f1d; box-shadow: 0 0 0 2px rgba(74,47,29,.4); }
  #meter .lvl { flex: none; min-width: 4.6em; text-align: center; font-weight: 800; font-size: .8rem; border: 2px solid var(--line); border-radius: 999px; padding: 0 6px; background: var(--card); color: var(--ink); line-height: 1.5; white-space: nowrap; }
  #meter.l1 .bar i { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.4) 0 4px, transparent 4px 10px); }
  #meter.l2 .bar i, #meter.l3 .bar i { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 3px, transparent 3px 6px); }

  body.calm #meter .lvl { animation: none; }
  @keyframes lvb { 50% { opacity: .5; } }
  #hY.bump { animation: bump .22s ease-out; }

  #toast { position: fixed; left: 50%; bottom: max(118px, calc(env(safe-area-inset-bottom) + 112px)); transform: translateX(-50%); z-index: 50; max-width: 92vw; background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: .86rem; box-shadow: 0 4px 0 rgba(0,0,0,.2); pointer-events: none; opacity: 0; transition: opacity .25s; }

  /* ゲーム画面：残りの高さいっぱいに、縦横比 450:540 を保って最大の大きさで置く */

  .cats button:disabled { background: #fbf3e6; cursor: default; }
  .cats button:disabled b { color: #b39a80; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .btn { flex: 1; min-width: 0; font: inherit; font-size: 1rem; font-weight: 800; text-align: center; text-decoration: none; padding: 10px 6px; border: 0; border-radius: 14px; background: var(--org); color: #fff; cursor: pointer; display: block; box-shadow: 0 4px 0 var(--org-d); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--org-d); }
  .btn.go { font-size: 1.4rem; padding: 12px; width: 100%; }
  .btn.w { background: #fff; color: var(--org-d); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
  .btn.t { background: var(--teal); box-shadow: 0 4px 0 var(--teal-d); }
  .btn.y { background: var(--yel); color: var(--ink); box-shadow: 0 4px 0 #d9a526; }
  .btn.b { background: var(--brn); color: #fff; box-shadow: 0 4px 0 var(--brn-d); }
  .btn.y:active { box-shadow: 0 1px 0 #d9a526; } .btn.b:active { box-shadow: 0 1px 0 var(--brn-d); } .btn.t:active { box-shadow: 0 1px 0 var(--teal-d); }
  .btn .ic { display: inline-block; width: 1.3em; height: 1.3em; vertical-align: -0.3em; margin-right: .25em; fill: currentColor; }
  /* 結果画面の下の支援リンク（Buy Me a Coffee）。遊ぶボタンより目立たせない */
  .share-row { display: flex; gap: 8px; align-items: stretch; margin: 6px 0 2px; }
  .panel .share-row img { flex: 0 0 calc(50% - 4px); width: calc(50% - 4px); height: auto; margin: 0; align-self: center; cursor: zoom-in; }
  /* 画像を大きく見る（タップで閉じる） */
  #lb { position: fixed; inset: 0; z-index: 60; background: rgba(40,20,8,.82); display: flex; align-items: center; justify-content: center; padding: 12px; cursor: zoom-out; }

  #lb small { color: #ffe9a8; font-size: .9rem; font-weight: 500; text-align: center; max-width: 320px; }

  .btn.sm { padding: 7px 6px; font-size: .92rem; border-radius: 12px; }
  .btn.go small { display: block; font-size: .76rem; font-weight: 500; line-height: 1.3; margin-top: 2px; }

  .coffee small { font-weight: 500; opacity: .8; }
  /* 4.35.0：気持ちが上がった画面（ベスト更新・完走）だけ、飼い主のひとこと＋「¥500 だけ弁償する」 */

  /* 次の目標：結果画面の被害額の下に小さく */

  .panel img { width: 100%; height: auto; border-radius: 12px; display: block; margin: 6px 0; background: #f6e2c4; aspect-ratio: 1200 / 630; }
  .stats { display: grid; grid-template-columns: auto auto; gap: 3px 12px; align-items: center; text-align: left; width: max-content; margin: 2px auto 10px; font-weight: 800; font-size: .78rem; }

  .online[hidden] { display: none; }
  /* 怪しまれ度の段階を、ゲーム画面の外枠の色と点滅でも見せる（上のバーと同じ段階） */

<script>
(() => {
'use strict';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 450, H = 540, FLOOR = 500, GRAV = 1400, JUMP = 580, SPEED = 150;
// 描画の解像度：ゲーム座標 1 単位あたりの実ピクセル数。fit() で「表示の拡大率 × 端末のピクセル比」に合わせる
// （PC の大きな画面で引き伸ばされてぼやけないように。重くなりすぎないよう 1〜3 に収める）
let DPR = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
let VH = H, OY = 0, BOT = H;   // VH：表示する高さ。縦長の画面で余った高さは、6割を壁の上（OY）、4割を床の下（BOT は見えている一番下の y）に回す
cv.width = W * DPR; cv.height = H * DPR;
// 字体：日本語の字形で出るものだけを並べる（system-ui は端末によって中国語の字形になるので使わない）
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif';
// キャンバスの文字は、字体が読み込まれる前に描くと代わりの字体になる。読み込みを先に始めておく（毎フレーム描き直すので、届いたら切り替わる）
try { document.fonts.load(`500 16px "M PLUS Rounded 1c"`); document.fonts.load(`800 16px "M PLUS Rounded 1c"`); } catch (e) {}
const SITE = 'https://kotaooka.github.io/mischievous-cat/';
// バージョン（中身を変えたら上げる。sw.js の VERSION とは別）
const APP_VER = '4.48.11', REPO = 'https://github.com/kotaooka/mischievous-cat', AUTHOR = 'Kota Ooka';   // AUTHOR：スタッフロールと締めの画面に出す作者名
const verLine = () => `<p class="ver">v${APP_VER}　<a href="${REPO}" target="_blank" rel="noopener">GitHub</a></p>${lastErrLine()}`;
// 最後に起きたエラーを端末に残し、設定画面のバージョンの下に小さく出す（原因を調べるため。押すと消える）
function noteErr(kind, e) { try { const msg = (e && (e.message || e.reason && e.reason.message)) || String(e && e.reason || e), st = (e && (e.error && e.error.stack || e.reason && e.reason.stack)) || ''; store.set('nekoLastErr', JSON.stringify({ v: APP_VER, kind, state: typeof state === 'string' ? state : '', msg: String(msg).slice(0, 160), stack: String(st).slice(0, 400), at: new Date().toISOString() })); } catch (e2) {} }
window.addEventListener('error', e => noteErr('error', e));
window.addEventListener('unhandledrejection', e => noteErr('promise', e));
function lastErrLine() { try { const j = JSON.parse(store.get('nekoLastErr', '') || 'null'); if (!j) return ''; return `<p class="ver lasterr" style="font-size:.62rem;color:#b35;cursor:pointer" title="${lt('押すと消える', 'Tap to clear')}">ERR v${j.v} ${j.state} ${j.kind}: ${esc(j.msg)}${j.stack ? '<br>' + esc(j.stack.split('\n').slice(0, 2).join(' / ')) : ''}</p>`; } catch (e) { return ''; } }
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[(Math.random() * a.length) | 0];
// 重みつきで1つ選ぶ（空なら null）
const pickW = (a, wf) => { if (!a.length) return null; const ws = a.map(wf), tot = ws.reduce((s, w) => s + w, 0); let r = Math.random() * tot; for (let i = 0; i < a.length; i++) { r -= ws[i]; if (r <= 0) return a[i]; } return a[a.length - 1]; };
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const TAU = Math.PI * 2;
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};
// 4.44.0：点の付け方を変えた（8 日目以降をなくし、腕前のボーナスを約 2 倍に）。前の版の自己ベストと端末のランキングは比べられないので、一度だけ消す
if (store.get('nekoScoreV', '') !== '2') {
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && (k === 'nekoWorldBest' || k === 'nekoRank' || k.startsWith('nekoDailyBest-'))) localStorage.removeItem(k); } } catch (e) {}
  store.set('nekoScoreV', '2');
}
// ---------- 言語（日本語 ja ／ 英語 en）----------
// 初めて開いたときは端末の言語で決める（日本語以外は英語）。タイトル画面とポーズ画面で切り替えられ、選んだほうを覚える
let lang = store.get('nekoLang', '') || (/^ja/i.test((typeof navigator !== 'undefined' && navigator.language) || 'ja') ? 'ja' : 'en');
if (lang !== 'ja' && lang !== 'en') lang = 'ja';
// lt：その場で言語を選ぶ。tx：表や台詞に入れておく文。文字列として使ったとき（描画・連結・テンプレート）に、その時点の言語の文になる
const lt = (ja, en) => (lang === 'en' ? en : ja);
class Tx { constructor(ja, en) { this.ja = ja; this.en = en; } toString() { return lang === 'en' ? this.en : this.ja; } valueOf() { return this.toString(); } }
const tx = (ja, en) => new Tx(ja, en);

// ---------- 足場（上からだけ乗れる）----------
const PL = {
  floor: { x0: -20, x1: W + 20, y: FLOOR },
  side:  { x0: 20,  x1: 98,  y: 445 },   // サイドテーブル
  table: { x0: 125, x1: 300, y: 430 },   // テーブル
  shelf: { x0: 105, x1: 270, y: 355 },   // 壁の棚
  tower: { x0: 335, x1: 375, y: 440 },   // キャットタワー（上は安全地帯）。てこの先と重ならないよう、本棚の前に置く
  book:  { x0: 345, x1: W - 2, y: 285 }, // 本棚（床からは前を歩ける）
  // 壁の高い足場：段差はどれも 75px 以内（メインクーンのジャンプでも届く高さ）
  rail:  { x0: 14,  x1: 118, y: 285 },   // カーテンレール（壁の棚の左端から登る）
  hang:  { x0: 148, x1: 252, y: 280 },   // 吊り棚（壁の棚から登る）
  ac:    { x0: 262, x1: 338, y: 210 },   // エアコン（キッチンは吊り戸棚。吊り棚か本棚から登る）
  tank:  { x0: 24,  x1: 96,  y: 400 },   // 水槽のふた（子ども部屋だけ。サイドテーブルの上）

  ex1:   { x0: -900, x1: -860, y: -900 },
  ex2:   { x0: -900, x1: -860, y: -900 }
};
const OFFP = { x0: -900, x1: -860, y: -900 };   // 使わない足場の置き場所（画面の外）
const EXK = ['ex1', 'ex2'];
const plOn = k => PL[k].x1 > -100;   // その面で使う足場か
// 足す足場に置けるもの：as の足場に置けるものと同じ（例：ソファーの背もたれは side と同じもの）
const onList = list => list.concat(EXK.filter(k => plOn(k) && PL[k].as && list.includes(PL[k].as)));
const HIGH = [PL.rail, PL.hang, PL.ac];
// 4.47.0：部屋ごとの家具（足場の位置と形）。絵は必ず PL の値から描くので、足場の判定と絵がずれない
// 足場の役：side 低い台、table 横長の台、rail 左の高い所、tower 安全地帯、book 右の背の高い家具。ここに書いた部屋だけ、既定の位置を上書きする
const PL_DEF = {}; for (const k in PL) PL_DEF[k] = Object.assign({}, PL[k]);
const ROOM_GEO = {
  // キッチン：左に食器棚（下の台＝side、上＝rail）。窓は食器棚の後ろになるので描かない。壁の棚・吊り棚は食器棚に重ならないよう右へ寄せる
  kitchen: { side: { x0: 14, x1: 108, y: 430 }, rail: { x0: 14, x1: 108, y: 285 }, table: { x0: 116, x1: 300, y: 430 }, shelfMin: 128, hangMin: 118, noWindow: true, sideMaxH: 40, noGrab: [['rail', 'side']], niche: { plat: 'side', h: 46 }, mis: { dishcloth: [38, 74] } },
  // 書斎：デスクチェア（side）とデスク（table）。壁紙の爪とぎは窓の下、ネズミの穴は机と本棚の間
  study: { side: { x0: 92, x1: 134, y: 452 }, table: { x0: 142, x1: 300, y: 430 }, mis: { papers: [152, 188], wall: [10, 44] }, hole: 174 },
  // リビング：窓の下にソファー（座面＝side。ひじかけは座面と同じ高さ）。テーブルは右へ詰める。ネズミの穴はソファーとテーブルの間
  // 足す足場：ソファーの背もたれ（ex1）と、壁のテレビの上（ex2）
  living: { side: { x0: 12, x1: 132, y: 456 }, table: { x0: 156, x1: 300, y: 430 }, mis: { wall: [154, 192] }, hole: 144,
    ex: { ex1: { x0: 16, x1: 128, y: 422, as: 'side' }, ex2: { x0: 264, x1: 340, y: 264, as: 'ac', wall: true } } },
  // 寝室：ナイトテーブルの代わりに鏡台（ドレッサー）。ベッドは宮付き（宮の上＝ex1）。鏡は窓の下に収まる高さ
  bed: { side: { x0: 14, x1: 102, y: 438 }, table: { x0: 160, x1: 300, y: 430 }, hole: 180, ex: { ex1: { x0: 118, x1: 156, y: 392, as: 'side' } } },

function cardCheckLife() {
  for (const cd of CARDS) {
    if (!cd.life || cardsGot.has(cd.id)) continue;
    let ok = false; try { ok = !!cd.life(LIFE); } catch (e) {}
    if (!ok) continue;
    cardsGot.add(cd.id); newCards.push(cd.name); store.set('nekoCards', JSON.stringify([...cardsGot]));
    const pic = cardShot(); if (pic) { cardPics[cd.id] = pic; try { store.set('nekoCardPics', JSON.stringify(cardPics)); } catch (e) {} }
  }
}

// カードの絵：その瞬間の画面（犯行現場写真と同じ切り取り）を 128px にして保存する
function cardShot() {
  try { const sn = takeSnap(); if (!sn) return null; const c = document.createElement('canvas'); c.width = c.height = 256; c.getContext('2d').drawImage(sn, 0, 0, 256, 256); return c.toDataURL('image/jpeg', 0.72); } catch (e) { return null; }   // 4.42.2：128 → 256px（拡大表示でぼやけないように。1 枚 15KB ほど）
}
function cardCheck() {
  if (state !== 'play' || !run || run.preview || run.test) return;
  for (const cd of CARDS) {
    if (cardsGot.has(cd.id) || !cd.test) continue;
    let ok = false; try { ok = !!cd.test(run); } catch (e) {}
    if (!ok) continue;
    cardsGot.add(cd.id); newCards.push(cd.name); store.set('nekoCards', JSON.stringify([...cardsGot]));
    const pic = cardShot(); if (pic) { cardPics[cd.id] = pic; store.set('nekoCardPics', JSON.stringify(cardPics)); }
