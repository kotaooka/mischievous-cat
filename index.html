<style>
  :root {
    --bg: #fff3df;
    --ink: #4a2f1d;
    --ink2: #8a6a4f;
    --card: #fffaf2;
    --line: #f2d3a6;
    --org: #ff8a3d; --org-d: #c95f17;
    --teal: #2fb3a3; --teal-d: #1d8174;
    --red: #ff5a5a; --red-d: #c93636;
    --brn: #8a5a34; --brn-d: #5e3a1c;
    --yel: #ffc94a;
    --f: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  /* 画面いっぱいに表示する（ページはスクロールしない） */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--f);
    background-image: radial-gradient(circle, rgba(255, 138, 61, .10) 5px, transparent 6px);
    background-size: 36px 36px;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #app {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  #top, #meter, #pad { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; flex: none; }

  /* 上段：ロゴ・スコア・被害額・音 */
  #top { display: flex; align-items: center; gap: 6px; }
  .logo { font-weight: 800; font-size: 1.15rem; line-height: 1.05; white-space: nowrap; margin-right: auto; }
  .logo span { color: var(--org); }
  .logo small { display: block; font-size: .6rem; font-weight: 500; color: var(--ink2); letter-spacing: .08em; }
  .pill { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; font-weight: 800; font-size: .92rem; white-space: nowrap; line-height: 1.6; }
  .pill.yen { color: var(--red-d); }
  #bSnd, #bPause { width: 38px; height: 34px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  #bSnd svg, #bPause svg { width: 22px; height: 22px; }
  #bPause[hidden] { display: none; }
  /* 怪しまれ度 */
  #meter { display: flex; align-items: center; gap: 6px; margin-top: 6px; margin-bottom: 6px; }
  #meter svg { width: 26px; height: 18px; flex: none; }
  #meter .bar { flex: 1; height: 14px; background: #f6e2c4; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
  #meter .bar i { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: background .2s; }

  /* ゲーム画面：残りの高さいっぱいに、縦横比 450:540 を保って最大の大きさで置く */
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; width: 300px; height: 360px; }
  canvas#c { display: block; width: 100%; height: 100%; border-radius: 18px; border: 3px solid var(--brn-d); background: #e9d7b8; touch-action: none; }

  /* 画面を覆う案内（タイトル・結果・図鑑） */
  #ov { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; background: rgba(74, 47, 29, .55); border-radius: 18px; overflow: auto; padding: 10px; user-select: none; }
  #ov[hidden] { display: none; }
  .panel { background: var(--card); color: var(--ink); border: 3px solid var(--line); border-radius: 20px; padding: 14px; width: 100%; max-width: 400px; margin: auto; text-align: center; box-shadow: 0 6px 0 rgba(94, 58, 28, .25); }
  .big-logo { font-weight: 800; font-size: 2rem; line-height: 1.1; margin: 4px 0 2px; }
  .big-logo span { color: var(--org); }
  .sub { font-size: .75rem; color: var(--ink2); letter-spacing: .1em; margin: 0 0 8px; }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 10px; }
  .cats button { font: inherit; color: var(--ink); background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 2px 2px 6px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .cats button canvas { width: 72px; height: 54px; }
  .cats button b { font-size: .84rem; line-height: 1.3; }
  .cats button span { font-size: .66rem; color: var(--ink2); line-height: 1.3; }
  .cats button[aria-pressed="true"] { border-color: var(--org); background: #fff0dc; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .btn { flex: 1; min-width: 0; font: inherit; font-size: 1rem; font-weight: 800; text-align: center; text-decoration: none; padding: 10px 6px; border: 0; border-radius: 14px; background: var(--org); color: #fff; cursor: pointer; display: block; box-shadow: 0 4px 0 var(--org-d); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--org-d); }
  .btn.go { font-size: 1.4rem; padding: 12px; width: 100%; }
  .btn.w { background: #fff; color: var(--org-d); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
  .btn.t { background: var(--teal); box-shadow: 0 4px 0 var(--teal-d); }
  .best { font-weight: 800; color: var(--ink2); font-size: .9rem; margin: 6px 0 0; }
  .res-yen { font-weight: 800; font-size: 1rem; margin: 0; color: var(--ink2); }
  .res-yen b { display: block; font-size: 2.2rem; color: var(--red-d); line-height: 1.15; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0; }
  .badge { background: var(--brn); color: var(--yel); font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: .9rem; }
  .badge.new { background: var(--red); color: #fff; }
  .panel img { width: 100%; height: auto; border-radius: 12px; display: block; margin: 6px 0; background: #f6e2c4; aspect-ratio: 1200 / 630; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; align-items: center; text-align: left; margin: 2px 4px 10px; font-weight: 800; font-size: .78rem; }
  .stats .pips { display: flex; gap: 4px; }
  .stats .pips i { width: 18px; height: 10px; border-radius: 5px; background: #f2e2c8; }
  .stats .pips i.on { background: var(--org); }
  .stats .tag { grid-column: 1 / -1; text-align: center; color: var(--teal-d); font-size: .82rem; }
  .zukan { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 8px 0; text-align: left; }
  .zukan div { border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; font-weight: 800; font-size: .86rem; background: #fff; }
  .zukan div.off { color: #c9b39a; background: #fbf3e6; }
  .btn:focus-visible, .cats button:focus-visible, #pad button:focus-visible, #bSnd:focus-visible, #bPause:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  /* 下段の操作ボタン */
  #pad { display: grid; grid-template-columns: 1fr 1fr .9fr 1.15fr 1.15fr; gap: 6px; margin-top: 10px; }
  #pad button {
    --c: var(--brn); --s: var(--brn-d);
    height: 68px; border: 0; border-radius: 18px; background: var(--c); color: #fff;
    font: inherit; font-weight: 800; font-size: .74rem; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    box-shadow: 0 5px 0 var(--s); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer;
  }
  #pad button svg { width: 28px; height: 28px; }
  #pad #bM { --c: var(--teal); --s: var(--teal-d); }
  #pad #bJ { --c: var(--org); --s: var(--org-d); }
  #pad #bP { --c: var(--red); --s: var(--red-d); }
  #pad button.act { transform: translateY(4px); box-shadow: 0 1px 0 var(--s); }
  #pad button.hint { animation: hint .7s ease-in-out infinite; }
  @keyframes hint { 50% { filter: brightness(1.3); box-shadow: 0 5px 0 var(--s), 0 0 0 5px var(--yel); } }
  @media (max-height: 640px) { #pad button { height: 56px; } #pad { margin-top: 6px; } }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="logo">こっそり<span>ネコ</span><small>Mischievous Cat</small></div>
    <span class="pill" id="hS" aria-label="スコア">★0</span>
    <span class="pill yen" id="hY" aria-label="被害額">¥0</span>
    <button id="bPause" type="button" aria-label="ポーズ" hidden><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>

    <button id="bR" type="button" aria-label="右へ"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="bM" type="button" aria-label="鳴く"><svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" fill="currentColor"/><circle cx="8.5" cy="10" r="1.4" fill="#2fb3a3"/><circle cx="12" cy="10" r="1.4" fill="#2fb3a3"/><circle cx="15.5" cy="10" r="1.4" fill="#2fb3a3"/></svg>にゃー</button>
    <button id="bJ" type="button" aria-label="ジャンプ"><svg viewBox="0 0 24 24"><path d="M5 13l7-7 7 7M5 20l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>ジャンプ</button>
    <button id="bP" type="button" aria-label="パンチ"><svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="16" rx="5.2" ry="4.4"/><ellipse cx="5.2" cy="10.5" rx="2.2" ry="2.8"/><ellipse cx="9.3" cy="6.5" rx="2.2" ry="2.9"/><ellipse cx="14.7" cy="6.5" rx="2.2" ry="2.9"/><ellipse cx="18.8" cy="10.5" rx="2.2" ry="2.8"/></svg>パンチ</button>
  </div>
</div>
<script>
(() => {
'use strict';
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 450, H = 540, FLOOR = 500, GRAV = 1400, JUMP = 580, SPEED = 150;
const DPR = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
let VH = H, OY = 0;   // VH：表示する高さ（縦長の画面では壁を上に伸ばす）、OY：その伸ばした分
cv.width = W * DPR; cv.height = H * DPR;
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif';
const SITE = 'https://kotaooka.github.io/mischievous-cat/';
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[(Math.random() * a.length) | 0];
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const TAU = Math.PI * 2;
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} }
};

// ---------- 足場（上からだけ乗れる）----------
const PL = {
  floor: { x0: -20, x1: W + 20, y: FLOOR },
  side:  { x0: 20,  x1: 98,  y: 445 },   // サイドテーブル
  table: { x0: 125, x1: 300, y: 430 },   // テーブル
  shelf: { x0: 105, x1: 270, y: 355 },   // 壁の棚
  tower: { x0: 305, x1: 345, y: 440 },   // キャットタワー（上は安全地帯）
  book:  { x0: 345, x1: W - 2, y: 285 }  // 本棚（横からは入れない）
};
const PLS = Object.values(PL);
const VACP = { x0: 0, x1: 0, y: FLOOR - 14, vac: true };   // お掃除ロボの上（乗れる）
const BOX = { x: 215, w: 46, h: 46 };    // ダンボール（床で入ると隠れる）

// ---------- ネコ ----------
// pip は選択画面の目盛り（はやさ・ジャンプ・パンチ・かくれ・くいしんぼ、1〜5）。数値の倍率と合わせてある
// sus：見られたときの怪しまれやすさ、food：ごはんで増える時間の倍率
const CATS = [
  { id: 'kuro', name: '黒猫', note: 'かくれ上手', body: '#2b2b35', belly: '#3b3b48', eye: '#f2c94c', sus: 0.6, punch: 0.9, jump: 1, speed: 1, score: 1, food: 1, voice: 1.05, pip: [3, 3, 2, 5, 3] },
  { id: 'cha', name: '茶トラ', note: 'パンチ自慢', body: '#e8913f', belly: '#f7cf98', stripe: '#b8661e', eye: '#7bbf5a', sus: 1.05, punch: 1.35, jump: 1, speed: 1.08, score: 1, food: 1, voice: 1, pip: [4, 3, 4, 2, 3] },
  { id: 'saba', name: 'サバトラ', note: 'バランス', body: '#8e939c', belly: '#dfe2e6', stripe: '#4a4f58', eye: '#d6b84a', sus: 0.85, punch: 1.1, jump: 1.05, speed: 1.04, score: 1, food: 1, voice: 1.1, pip: [3, 4, 3, 3, 3] },
  { id: 'maine', name: 'メインクーン', note: '怪力・大食い', body: '#a8794a', belly: '#e6d0ad', stripe: '#6d4a2a', eye: '#d6b84a', sus: 1.15, punch: 1.6, jump: 0.85, speed: 0.95, score: 1, food: 1.5, big: 1.18, voice: 0.78, pip: [2, 2, 5, 1, 5] },
  { id: 'mike', name: '三毛猫', note: 'スコア1.3倍', body: '#f7f2e9', belly: '#ffffff', patch: [[-9, -22, 8, '#e8913f'], [8, -14, 7, '#2b2b35'], [14, -30, 6, '#e8913f'], [-16, -12, 5, '#2b2b35']], eye: '#7bbf5a', sus: 1, punch: 0.95, jump: 1, speed: 1, score: 1.3, food: 1, voice: 1.15, pip: [3, 3, 3, 3, 3], tag: 'スコア1.3倍' }
];
const PIPS = ['はやさ', 'ジャンプ', 'パンチ', 'かくれ', 'くいしんぼ'];

// ---------- 壊れるもの ----------
// snd：割れる音の種類（glass ガラス / cera 陶器 / elec 電子機器 / paper 紙 / pens ペン）
const IT = {
  cup:     { n: 'コップ',       yen: 500,    pts: 100,  m: 1,   noise: 0.6, w: 14, h: 16, snd: 'glass' },
  mug:     { n: 'マグカップ',   yen: 1500,   pts: 150,  m: 2.4, noise: 0.8, w: 16, h: 16, snd: 'cera' },
  wine:    { n: 'ワイングラス', yen: 3000,   pts: 250,  m: 1.1, noise: 1.0, w: 14, h: 28, snd: 'glass' },
  vase:    { n: '花瓶',         yen: 10000,  pts: 500,  m: 2,   noise: 1.6, w: 20, h: 32, snd: 'cera' },
  phone:   { n: 'スマホ',       yen: 120000, pts: 1000, m: 0.7, noise: 0.5, w: 12, h: 24, snd: 'elec' },
  tablet:  { n: 'タブレット',   yen: 80000,  pts: 800,  m: 1.3, noise: 0.6, w: 28, h: 20, snd: 'elec' },
  console: { n: 'ゲーム機',     yen: 45000,  pts: 600,  m: 2,   noise: 0.8, w: 32, h: 12, snd: 'elec' },
  tissue:  { n: 'ティッシュ箱', yen: 300,    pts: 60,   m: 0.8, noise: 0.3, w: 26, h: 16, snd: 'paper' },
  pens:    { n: 'ペン立て',     yen: 800,    pts: 80,   m: 1,   noise: 0.4, w: 16, h: 20, snd: 'pens' }
};
const SPOT = { side: [30, 90], table: [145, 285], shelf: [125, 255], book: [356, 402] };
const ON = {
  cup: ['side', 'table'], mug: ['table', 'shelf'], wine: ['table', 'shelf'], vase: ['shelf', 'book'],
  phone: ['side', 'table', 'shelf'], tablet: ['table', 'shelf', 'book'], console: ['table', 'book'],
  tissue: ['side', 'table'], pens: ['side', 'table', 'book']
};

// ---------- 称号 ----------
const TITLES = [
  { id: 't1', name: '見習いネコ', tier: 0 },
  { id: 't2', name: '食器破壊職人', tier: 10000 },
  { id: 't3', name: 'キッチンの悪夢', tier: 60000 },
  { id: 't4', name: 'リビング崩壊請負猫', tier: 200000 },
  { id: 't5', name: '伝説の食器破壊者', tier: 500000 },
  { id: 'phone', name: 'スマホ破壊神', test: r => (r.broke.phone || 0) >= 2 },
  { id: 'water', name: '水難の相', test: r => r.water >= 3 },
  { id: 'kaku', name: '確信犯', test: r => r.kakushin >= 3 },
  { id: 'ride', name: 'お掃除ロボ乗り', test: r => r.rideT >= 8 },
  { id: 'chain', name: 'ピタゴラ職人', test: r => r.maxChain >= 3 },
  { id: 'idle', name: '堂々と寝る犯人', test: r => r.idle },
  { id: 'paper', name: '紙吹雪の演出家', test: r => (r.broke.tissue || 0) >= 3 },
  { id: 'print', name: '足跡アーティスト', test: r => r.prints >= 40 },
  { id: 'dog', name: '番犬の天敵', test: r => r.barks >= 3 },
  { id: 'book', name: '本棚の主', test: r => r.bookBroke >= 3 },
  { id: 'fast', name: '秒殺', test: r => r.fast },
  { id: 'zero', name: '冤罪ネコ', test: r => r.yen === 0 },
  { id: 'food', name: 'くいしんぼう', test: r => r.fed >= 3 }
];
let unlocked = new Set();
try { unlocked = new Set(JSON.parse(store.get('nekoTitles', '[]'))); } catch (e) {}

// ---------- 飼い主のモード ----------
const MODE = {
  away:   { range: 0,   rate: 0 },
  walk:   { range: 230, rate: 28 },
  leave:  { range: 230, rate: 28 },
  warn:   { range: 600, rate: 8 },
  look:   { range: 600, rate: 60 },
  up:     { range: 600, rate: 60 },
  phone:  { range: 100, rate: 10, omni: true },
  search: { range: 600, rate: 70 },
  feed:   { range: 230, rate: 28 }
};
const REACT = ['こらーっ!!', '見〜た〜ぞ〜', 'またお前か!!', 'ちょっと!?', '何してんの!!'];
const REACT_TIME = ['もう寝るよ〜', 'はい、おしまい', 'そろそろ寝なさい'];
const CAUGHT_DUR = 2.9;

function commentOf() {

  } else {
    cat.anim += dt;
  }
  updParts(dt);
}

// ---------- 画面（HUD・タイトル・結果・図鑑）----------
const $ = id => document.getElementById(id);
const hS = $('hS'), hY = $('hY'), hB = $('hB'), ov = $('ov'), bPause = $('bPause');
// ゲーム画面を、残りの領域いっぱいに広げる。
// 横幅で決まるとき（縦長の画面）は、余った高さの分だけ壁を上に伸ばす（最大で 1.6 倍）。
function fit() {
  try {
    const r = $('stage').getBoundingClientRect(); if (!r.width || !r.height) return;
    let w = r.width, s = w / W, vh = r.height / s;
    if (vh < H) { vh = H; s = r.height / H; w = W * s; }
    vh = Math.min(vh, H * 1.6);
    VH = Math.round(vh); OY = VH - H;
    cv.width = W * DPR; cv.height = VH * DPR;
    const fr = $('frame'); fr.style.width = Math.floor(w) + 'px'; fr.style.height = Math.floor(VH * s) + 'px';
  } catch (e) {}
}
window.addEventListener('resize', fit);
let lastHud = '';
function hud() {
  const s = run ? run.score.toLocaleString('ja-JP') : '0', y = run ? yen(run.yen) : '¥0', b = Math.round(sus);
  const showP = state === 'play' || state === 'clear'; if (bPause.hidden === showP) bPause.hidden = !showP;
  const key = s + '|' + y + '|' + b; if (key === lastHud) return; lastHud = key;
  hS.textContent = '★' + s; hY.textContent = y; hB.style.width = b + '%';
  hB.style.background = b >= 70 ? 'var(--red)' : b >= 40 ? 'var(--yel)' : 'var(--teal)';
}
function showTitle() {
  state = 'title'; newRun(); ov.hidden = false; setPulse(null);
  ov.innerHTML = `<div class="panel">
    <div class="big-logo">こっそり<span>ネコ</span></div><p class="sub">MISCHIEVOUS CAT</p>
    <div class="cats" role="group" aria-label="ネコをえらぶ">${CATS.map((c, i) => `<button type="button" data-i="${i}" aria-pressed="${i === selCat}"><canvas width="144" height="108"></canvas><b>${c.name}</b><span>${c.note}</span></button>`).join('')}</div>
    <div class="stats" id="stats"></div>
    <button class="btn go" id="goBtn" type="button">あそぶ</button>
    <div class="row"><button class="btn w" id="zkBtn" type="button">称号図鑑 ${unlocked.size}/${TITLES.length}</button></div>
    <p class="best">ベスト被害額 ${yen(bestYen)}</p></div>`;
  ov.querySelectorAll('.cats canvas').forEach((cn, i) => { const c2 = cn.getContext('2d'); c2.scale(2, 2); drawCat(c2, 34, 49, { type: CATS[i], face: 1, scale: 0.8, t: 0, pose: 'walk' }); });
  ov.querySelectorAll('.cats button').forEach(b => b.addEventListener('click', () => {
    selCat = +b.dataset.i; store.set('nekoCat', String(selCat)); audio(); sfx.meow(CATS[selCat].voice, pickVoice());
    ov.querySelectorAll('.cats button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); setupStage(1); showStats();
  }));
  showStats();
  $('goBtn').addEventListener('click', () => { audio(); startGame(); });
  $('zkBtn').addEventListener('click', showZukan);
}
function showStats() {
  const T = CATS[selCat], el = $('stats'); if (!el) return;
  el.innerHTML = PIPS.map((n, i) => `<span>${n}</span><span class="pips">${[1, 2, 3, 4, 5].map(k => `<i class="${k <= T.pip[i] ? 'on' : ''}"></i>`).join('')}</span>`).join('') + (T.tag ? `<span class="tag">${T.tag}</span>` : '');
}
function showZukan() {
  ov.hidden = false;
  ov.innerHTML = `<div class="panel">
    <div class="big-logo" style="font-size:1.5rem">称号図鑑</div><p class="sub">${unlocked.size} / ${TITLES.length}</p>
    <div class="zukan">${TITLES.map(t => unlocked.has(t.id) ? `<div>${t.name}</div>` : '<div class="off">？？？</div>').join('')}</div>
    <button class="btn" id="zkBack" type="button">もどる</button></div>`;
  $('zkBack').addEventListener('click', state === 'over' ? showOver : showTitle);
}
function startGame() { ov.hidden = true; newRun(); state = 'play'; }
function pauseGame() {
  if (state !== 'play' && state !== 'clear') return;
  pausedFrom = state; state = 'pause'; keys.L = keys.R = false; punchUp(); setPulse(null); showPause();
}
function resumeGame() { if (state !== 'pause') return; ov.hidden = true; state = pausedFrom; }
function showPause() {
  ov.hidden = false;
  ov.innerHTML = `<div class="panel">
    <div class="big-logo" style="font-size:1.6rem">ひとやすみ</div><p class="sub">PAUSE</p>
    <button class="btn go" id="pResume" type="button">つづける</button>
    <div class="row"><button class="btn w" id="pRetry" type="button">やりなおす</button><button class="btn w" id="pTop" type="button">トップへ</button></div>
    <div class="row"><button class="btn w" id="pSnd" type="button">${muted ? '音をオンにする' : '音をオフにする'}</button></div></div>`;
  $('pResume').addEventListener('click', resumeGame);
  $('pRetry').addEventListener('click', () => { audio(); startGame(); });
  $('pTop').addEventListener('click', showTitle);
  $('pSnd').addEventListener('click', () => { toggleSound(); showPause(); });
}
let cardBlob = null, cardUrl = null, cardFor = null;
function shareText() { return `本日の被害額 ${yen(run.yen)}\nステージ${run.stage}／称号「${titleOf(run.yen)}」\n飼い主「${run.comment}」\n#MischievousCat #こっそりネコ`; }
async function showOver() {
  const xUrl = 'https://x.com/intent/post?text=' + encodeURIComponent(shareText()) + '&url=' + encodeURIComponent(SITE);
  ov.hidden = false;
  ov.innerHTML = `<div class="panel">
    <p class="res-yen">本日の被害額<b>${yen(run.yen)}</b></p>
    <div class="badges">${newTitles.includes(titleOf(run.yen)) ? '' : `<span class="badge">${titleOf(run.yen)}</span>`}${newTitles.map(n => `<span class="badge new">NEW ${n}</span>`).join('')}</div>
    ${newRec ? '<p class="best" style="color:var(--red-d)">ベスト更新!</p>' : ''}
    <img id="card" alt="犯行現場写真" width="1200" height="630">
    <div class="row"><button class="btn t" id="bShare" type="button">シェア</button><button class="btn w" id="bSave" type="button">保存</button><a class="btn w" id="bX" href="${xUrl}" target="_blank" rel="noopener">Xに投稿</a></div>
    <div class="row"><button class="btn go" id="bAgain" type="button">もう一回</button></div>
    <div class="row"><button class="btn w" id="bChange" type="button">トップへ</button><button class="btn w" id="bZk" type="button">称号図鑑</button></div></div>`;
  $('bAgain').addEventListener('click', () => { audio(); startGame(); });
  $('bChange').addEventListener('click', showTitle);
  $('bZk').addEventListener('click', showZukan);
  $('bShare').addEventListener('click', doShare);
  $('bSave').addEventListener('click', saveCard);
  if (cardFor === run && cardUrl) { $('card').src = cardUrl; return; }
  cardBlob = null; cardFor = run;
  try {
    const cn = await makeCard();
    cardBlob = await new Promise(r => cn.toBlob(r, 'image/png'));
    if (cardUrl) URL.revokeObjectURL(cardUrl);
    cardUrl = URL.createObjectURL(cardBlob);
    const im = $('card'); if (im) im.src = cardUrl;
  } catch (e) { /* 画像を作れない環境ではテキストだけ共有する */ }
}
async function doShare() {
  const text = shareText();
  try {
    if (cardBlob && navigator.canShare) {
      const file = new File([cardBlob], 'mischievous-cat.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: text + '\n' + SITE }); return; }
    }
    if (navigator.share) { await navigator.share({ text, url: SITE }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  window.open('https://x.com/intent/post?text=' + encodeURIComponent(text) + '&url=' + encodeURIComponent(SITE), '_blank', 'noopener');
}
function saveCard() {
  if (!cardUrl) return;
  const a = document.createElement('a'); a.href = cardUrl; a.download = 'mischievous-cat-' + Math.round(run.yen) + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}
async function makeCard() {
  try { await document.fonts.load(`800 40px "M PLUS Rounded 1c"`); } catch (e) {}
  const cn = document.createElement('canvas'); cn.width = 1200; cn.height = 630;
  const c = cn.getContext('2d'), T = CATS[selCat];
  // 背景：オレンジに肉球の模様
  const bg = c.createLinearGradient(0, 0, 1200, 630); bg.addColorStop(0, '#ffb35c'); bg.addColorStop(1, '#ff7a2e');
  c.fillStyle = bg; c.fillRect(0, 0, 1200, 630);
  c.fillStyle = 'rgba(255,255,255,.12)';
  for (let y = 40; y < 630; y += 110) for (let x = (y / 110 % 2) * 60 + 40; x < 1200; x += 120) {
    c.beginPath(); c.ellipse(x, y + 8, 14, 11, 0, 0, TAU); c.fill();
    [[-15, -6], [-6, -15], [6, -15], [15, -6]].forEach(([dx, dy]) => { c.beginPath(); c.arc(x + dx, y + dy, 5, 0, TAU); c.fill(); });
  }
  // 犯行現場写真（ポラロイド）
  c.save(); c.translate(290, 318); c.rotate(-0.06);
  c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(-192, -262, 400, 540);
  c.fillStyle = '#fff'; c.fillRect(-200, -272, 400, 540);
  if (snap) c.drawImage(snap, -180, -252, 360, 432);
  else { c.fillStyle = '#f6d7a8'; c.fillRect(-180, -252, 360, 432); drawCat(c, 10, 120, { type: T, face: 1, scale: 4, t: 0.6, pose: 'smug' }); }
  c.fillStyle = 'rgba(255,220,120,.75)'; c.save(); c.rotate(0.05); c.fillRect(-60, -290, 120, 34); c.restore();
  c.fillStyle = '#4a2f1d'; c.font = `800 30px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.fillText('犯行現場　ステージ' + run.stage, 0, 230);
  c.restore();
  // 文字
  const X = 560, stroke = (t, x, y, size, fill, sw) => { c.font = `800 ${size}px ${FONT}`; c.lineJoin = 'round'; c.lineWidth = sw || 10; c.strokeStyle = '#7a3510'; c.strokeText(t, x, y); c.fillStyle = fill; c.fillText(t, x, y); };
  c.textAlign = 'left'; c.textBaseline = 'alphabetic';
  stroke('こっそりネコ', X, 84, 46, '#fff', 10);
  c.font = `800 22px ${FONT}`; c.fillStyle = 'rgba(255,255,255,.9)'; c.fillText('MISCHIEVOUS CAT', X + 4, 118);
  stroke('本日の被害額', X, 186, 32, '#ffe9a8', 8);
  const ys = yen(run.yen); let fs = 108; c.font = `800 ${fs}px ${FONT}`;
  while (c.measureText(ys).width > 600 && fs > 50) { fs -= 4; c.font = `800 ${fs}px ${FONT}`; }
  stroke(ys, X, 196 + fs * 0.9, fs, '#fff', 14);
  // 称号のバッジ
  const tt = titleOf(run.yen); c.font = `800 34px ${FONT}`; const tw = c.measureText(tt).width + 48, ty = 340;
  c.fillStyle = '#4a2f1d'; rr(c, X, ty, tw, 58, 29); c.fill(); c.fillStyle = '#ffc94a'; c.fillText(tt, X + 24, ty + 41);
  // 飼い主のひとこと
  const q = '「' + run.comment + '」', bx = X, by = 424, bw = 600, bh = 104;
  c.fillStyle = '#fff'; rr(c, bx, by, bw, bh, 24); c.fill();
  c.beginPath(); c.moveTo(bx + 40, by + bh); c.lineTo(bx + 30, by + bh + 26); c.lineTo(bx + 76, by + bh); c.fill();
  c.fillStyle = '#8a6a4f'; c.font = `800 22px ${FONT}`; c.fillText('飼い主のひとこと', bx + 26, by + 36);
  let qs = 34; c.font = `800 ${qs}px ${FONT}`; while (c.measureText(q).width > bw - 50 && qs > 18) { qs -= 2; c.font = `800 ${qs}px ${FONT}`; }
  c.fillStyle = '#4a2f1d'; c.fillText(q, bx + 22, by + 82);
  c.fillStyle = '#fff'; c.font = `800 24px ${FONT}`; c.fillText('#MischievousCat  #こっそりネコ', X, 600);
  c.textAlign = 'right'; c.font = `800 20px ${FONT}`; c.fillStyle = 'rgba(255,255,255,.9)'; c.fillText('kotaooka.github.io/mischievous-cat', 1180, 32);
  return cn;
}

// ---------- 入力 ----------
function jumpPress() { if (state === 'play' || state === 'clear') cat.jumpBuf = 0.12; }
function punchDown() { if (state !== 'play' || cat.pDown) return; cat.pDown = true; cat.pHeld = 0; }
function punchUp() { if (!cat.pDown) return; cat.pDown = false; if (state === 'play') cat.punchReq = cat.pHeld >= 0.35; cat.pHeld = 0; }
function hold(id, on, off) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} audio(); b.classList.add('act'); on(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, () => { b.classList.remove('act'); off(); }));
  b.addEventListener('contextmenu', e => e.preventDefault());
}
hold('bL', () => { keys.L = true; }, () => { keys.L = false; });
hold('bR', () => { keys.R = true; }, () => { keys.R = false; });
hold('bJ', jumpPress, () => {});
hold('bP', punchDown, punchUp);
hold('bM', () => { if (state === 'play') meow(); }, () => {});
const SND_ON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const SND_OFF = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
function soundLabel() { const b = $('bSnd'); b.innerHTML = muted ? SND_OFF : SND_ON; b.setAttribute('aria-pressed', String(!muted)); }
function toggleSound() { muted = !muted; store.set('nekoMute', muted ? '1' : '0'); soundLabel(); if (!muted) audio(); }
$('bSnd').addEventListener('click', toggleSound);
bPause.addEventListener('click', pauseGame);
soundLabel();
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.L = true;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.R = true;
  else if (k === 'ArrowUp' || k === 'w' || k === 'W') { if (!e.repeat) jumpPress(); }
  else if (k === ' ' || k === 'z' || k === 'Z') { if (state === 'play') { if (!e.repeat) { audio(); punchDown(); } } else return; }
  else if (k === 'x' || k === 'X') { if (!e.repeat && state === 'play') meow(); }
  else if (k === 'm' || k === 'M') { toggleSound(); }
  else if (k === 'Escape' || k === 'p' || k === 'P') { if (state === 'pause') resumeGame(); else pauseGame(); return; }
  else return;
  if (state === 'play' || state === 'clear') e.preventDefault();
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.L = false;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.R = false;
  else if (k === ' ' || k === 'z' || k === 'Z') punchUp();
});
// 別のアプリやタブに切り替えたら、自動でポーズする
window.addEventListener('blur', () => { keys.L = keys.R = false; punchUp(); pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

// ---------- ループ ----------
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw(); hud();
  requestAnimationFrame(frame);
}
fit();
showTitle();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
requestAnimationFrame(frame);
})();
</script>
