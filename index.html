<style>
  @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/mplus-rounded-500.woff2") format("woff2"); }
  @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 800; font-style: normal; font-display: swap; src: url("fonts/mplus-rounded-800.woff2") format("woff2"); }
  :root {
    --bg: #fff3df;
    --ink: #4a2f1d;
    --ink2: #8a6a4f;
    --card: #fffaf2;
    --line: #f2d3a6;
    --org: #ff8a3d; --org-d: #c95f17;
    --teal: #2fb3a3; --teal-d: #1d8174;
    --red: #ff5a5a; --red-d: #c93636;
    --brn: #8a5a34; --brn-d: #5e3a1c;
    --yel: #ffc94a;
    --f: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  }
  * { box-sizing: border-box; }
  /* 画面いっぱいに表示する（ページはスクロールしない） */
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--f);
    background-image: radial-gradient(circle, rgba(255, 138, 61, .10) 5px, transparent 6px);
    background-size: 36px 36px;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  #app {
    height: 100vh; height: 100dvh; height: var(--app-h, 100dvh); display: flex; flex-direction: column;
    padding: max(6px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  #top, #meter, #pad { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; flex: none; }

  /* 上段：ロゴ・スコア・被害額・音 */
  #top { display: flex; align-items: center; gap: 6px; }
  .logo { font-weight: 800; font-size: 1.15rem; line-height: 1.05; white-space: nowrap; margin-right: auto; }
  .logo span { color: var(--org); }
  .logo small { display: block; font-size: .6rem; font-weight: 500; color: var(--ink2); letter-spacing: .08em; }
  .pill { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 1px 10px; font-weight: 800; font-size: .92rem; white-space: nowrap; line-height: 1.6; }
  .pill.yen { color: var(--red-d); font-size: 1.3rem; line-height: 1.35; padding: 1px 12px; font-variant-numeric: tabular-nums; }
  @media (max-width: 360px) { .pill.yen { font-size: 1.1rem; } .logo { font-size: 1rem; } }
  #bSnd, #bPause { width: 38px; height: 34px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  #bSnd svg, #bPause svg { width: 22px; height: 22px; }
  #bPause[hidden] { display: none; }
  /* 怪しまれ度 */
  #meter { display: flex; align-items: center; gap: 6px; margin-top: 6px; margin-bottom: 6px; }
  #meter svg { width: 26px; height: 18px; flex: none; }
  #meter .bar { flex: 1; height: 19px; background: #f6e2c4; border: 2px solid var(--line); border-radius: 999px; overflow: hidden; }
  #meter .bar i { display: block; height: 100%; width: 0; background: var(--teal); border-radius: 999px; transition: background .2s; }
  /* 怪しまれ度は色だけでなく、言葉・しま模様・目の開き具合でも段階を示す */
  #meter .lvl { flex: none; min-width: 4.6em; text-align: center; font-weight: 800; font-size: .8rem; border: 2px solid var(--line); border-radius: 999px; padding: 0 6px; background: var(--card); color: var(--ink); line-height: 1.5; white-space: nowrap; }
  #meter svg circle { transform-origin: 13px 9px; transition: transform .2s; }
  #meter.l0 svg circle { transform: scale(.55); }
  #meter.l2 svg circle, #meter.l3 svg circle { transform: scale(1.3); }
  #meter.l1 .bar i { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.4) 0 4px, transparent 4px 10px); }
  #meter.l2 .bar i, #meter.l3 .bar i { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.5) 0 3px, transparent 3px 6px); }
  #meter.l1 .lvl { background: var(--yel); }
  /* かくれ中：上がらないことを、緑の札とバーのふちで示す */
  #meter.l4 .lvl { background: var(--teal); color: #fff; border-color: var(--teal-d); }
  #meter.l4 .bar { border-color: var(--teal-d); box-shadow: 0 0 0 2px rgba(47,179,163,.35); }
  #meter.l4 svg circle { transform: scale(.3); }
  #meter.l2 .lvl, #meter.l3 .lvl { background: var(--red-d); color: #fff; animation: lvb .6s steps(2) infinite; }
  #meter.l2 .bar, #meter.l3 .bar { border-color: var(--red-d); box-shadow: 0 0 0 2px rgba(255,90,90,.35); }
  body.calm #meter .lvl { animation: none; }
  @keyframes lvb { 50% { opacity: .5; } }
  #hY.bump { animation: bump .22s ease-out; }
  @keyframes bump { 50% { transform: scale(1.15); } }
  /* 新しい版の知らせ */
  #upd { position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: var(--teal-d); color: #fff; border: 0; border-radius: 999px; padding: 8px 16px; font-family: inherit; font-weight: 800; font-size: .9rem; box-shadow: 0 4px 0 rgba(0,0,0,.2); cursor: pointer; white-space: nowrap; }
  #upd[hidden] { display: none; }
  /* 短い知らせ（画像をコピーした など）。数秒で消える */
  #toast { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; max-width: 92vw; background: var(--ink); color: #fff; border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: .86rem; box-shadow: 0 4px 0 rgba(0,0,0,.2); pointer-events: none; opacity: 0; transition: opacity .25s; }
  #toast.on { opacity: 1; }

  /* ゲーム画面：残りの高さいっぱいに、縦横比 450:540 を保って最大の大きさで置く */
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #frame { position: relative; width: 300px; height: 360px; }
  canvas#c { display: block; width: 100%; height: 100%; border-radius: 18px; border: 3px solid var(--brn-d); background: #e9d7b8; touch-action: none; }

  /* 画面を覆う案内（タイトル・結果・図鑑） */
  #ov { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; background: rgba(74, 47, 29, .55); border-radius: 18px; overflow: auto; padding: 10px; user-select: none; }
  #ov[hidden] { display: none; }
  .panel { background: var(--card); color: var(--ink); border: 3px solid var(--line); border-radius: 20px; padding: 14px; width: 100%; max-width: 400px; margin: auto; text-align: center; box-shadow: 0 6px 0 rgba(94, 58, 28, .25); }
  .big-logo { font-weight: 800; font-size: 2rem; line-height: 1.1; margin: 4px 0 2px; }
  .big-logo span { color: var(--org); }
  .sub { font-size: .75rem; color: var(--ink2); letter-spacing: .1em; margin: 0 0 8px; }
  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0 10px; }
  .cats button { font: inherit; color: var(--ink); background: #fff; border: 3px solid var(--line); border-radius: 14px; padding: 2px 2px 6px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
  .cats button canvas { width: 72px; height: 54px; }
  .cats button b { font-size: .84rem; line-height: 1.3; }
  .cats button span { font-size: .66rem; color: var(--ink2); line-height: 1.3; }
  .cats button[aria-pressed="true"] { border-color: var(--org); background: #fff0dc; }
  .cats button:disabled { background: #fbf3e6; cursor: default; }
  .cats button:disabled b { color: #b39a80; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .btn { flex: 1; min-width: 0; font: inherit; font-size: 1rem; font-weight: 800; text-align: center; text-decoration: none; padding: 10px 6px; border: 0; border-radius: 14px; background: var(--org); color: #fff; cursor: pointer; display: block; box-shadow: 0 4px 0 var(--org-d); }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--org-d); }
  .btn.go { font-size: 1.4rem; padding: 12px; width: 100%; }
  .btn.w { background: #fff; color: var(--org-d); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
  .btn.t { background: var(--teal); box-shadow: 0 4px 0 var(--teal-d); }
  /* 結果画面の下の支援リンク（Buy Me a Coffee）。遊ぶボタンより目立たせない */
  .coffee { display: inline-block; margin: 6px 0 2px; padding: 6px 14px; border-radius: 999px; background: #ffdd00; color: #3b2a1a; font-size: .82rem; font-weight: 800; text-decoration: none; }
  .coffee:active { transform: translateY(1px); }
  /* ボタン・ゲームパッド・キーボードでメニューを選ぶときの枠 */
  #ov .navf { outline: 4px solid #2b8fd9; outline-offset: 3px; position: relative; z-index: 1; }
  .best { font-weight: 800; color: var(--ink2); font-size: .9rem; margin: 6px 0 0; }
  .res-yen { font-weight: 800; font-size: 1rem; margin: 0; color: var(--ink2); }
  .res-yen b { display: block; font-size: 2.2rem; color: var(--red-d); line-height: 1.15; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 6px 0; }
  .badge.hid { display: none; }
  .badge.more { font: inherit; font-weight: 800; font-size: .8rem; cursor: pointer; background: var(--card); color: var(--org-d); border: 2px solid var(--org); }
  /* 次の目標：結果画面の被害額の下に小さく */
  .goal { margin: 2px 0 4px; font-size: .78rem; font-weight: 800; color: var(--teal-d); line-height: 1.5; }
  .goal span { display: block; }
  .goal span::before { content: '▶ '; color: var(--org); }
  .badge { background: var(--brn); color: var(--yel); font-weight: 800; border-radius: 999px; padding: 3px 12px; font-size: .9rem; }
  .badge.new { background: var(--red); color: #fff; }
  .panel img { width: 100%; height: auto; border-radius: 12px; display: block; margin: 6px 0; background: #f6e2c4; aspect-ratio: 1200 / 630; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; align-items: center; text-align: left; margin: 2px 4px 10px; font-weight: 800; font-size: .78rem; }
  .stats .pips { display: flex; gap: 4px; }
  .stats .pips i { width: 18px; height: 10px; border-radius: 5px; background: #f2e2c8; }
  .stats .pips i.on { background: var(--org); }
  .stats .tag { grid-column: 1 / -1; text-align: center; color: var(--teal-d); font-size: .82rem; }
  .accs { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin: 0 0 10px; }
  .accs button { font: inherit; font-weight: 800; font-size: .74rem; color: var(--ink); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
  .accs button[aria-pressed="true"] { border-color: var(--teal); background: #e3f6f3; }
  .accs button:disabled { color: #c9b39a; background: #fbf3e6; cursor: default; }
  .zukan { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 8px 0; text-align: left; }
  .zukan div { border: 2px solid var(--line); border-radius: 12px; padding: 6px 8px; font-weight: 800; font-size: .86rem; background: #fff; }
  .zukan div.off { color: #c9b39a; background: #fbf3e6; }
  .cert { border: 2px dashed var(--line); border-radius: 14px; padding: 10px 12px; margin: 8px 0; background: #fffaf0; }
  .end-panel .big-logo { color: var(--org-d); }
  .online[hidden] { display: none; }
  /* 怪しまれ度の段階を、ゲーム画面の外枠の色と点滅でも見せる（上のバーと同じ段階） */
  canvas#c { transition: border-color .2s, box-shadow .2s; }
  #frame.l1 canvas#c { border-color: #e8a800; box-shadow: 0 0 0 3px rgba(255,201,74,.55); }
  #frame.l2 canvas#c { border-color: #e0362c; animation: frmBlink 1s ease-in-out infinite; }
  #frame.l3 canvas#c { border-color: #ff3b30; animation: frmBlink .4s ease-in-out infinite; }
  #frame.l4 canvas#c { border-color: var(--teal-d); box-shadow: 0 0 0 3px rgba(47,179,163,.5); }
  @keyframes frmBlink { 0%, 100% { box-shadow: 0 0 0 2px rgba(255,59,48,.35); } 50% { box-shadow: 0 0 0 6px rgba(255,59,48,.85), 0 0 18px rgba(255,59,48,.6); } }
  body.calm #frame.l2 canvas#c, body.calm #frame.l3 canvas#c { animation: none; box-shadow: 0 0 0 4px rgba(255,59,48,.6); }
  .pager { touch-action: pan-y; flex: 1; min-height: 0; overflow-y: auto; }
  .panel.paged { display: flex; flex-direction: column; }
  .panel.paged > * { flex: none; }
  .panel.paged > .pager { flex: 1 1 auto; }
  .panel.paged > .rk-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .stat-list h4 { grid-column: 1 / -1; }
  .pg-title { margin: 4px 0 6px; text-align: center; color: var(--org-d); }
  .pager-nav { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .pager-nav .btn { flex: none; width: 52px; padding: 8px 0; }
  .pager-nav .btn[disabled] { opacity: .35; }
  .pg-dots { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; font-size: .8rem; color: var(--ink2); }
  .pg-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  .pg-dots i.on { background: var(--org); }
  .pg-dots b { margin-left: 6px; font-weight: 800; }
  .online.up, .online.err { padding: 6px 10px; }
  .zukan small { display: block; font-weight: 500; font-size: .7rem; color: var(--ink2); margin-top: 2px; line-height: 1.35; }
  /* いたずらカード：写真＋名前＋取り方 */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .cards div { border: 2px solid var(--line); border-radius: 12px; padding: 5px; background: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .cards div.off { background: #fbf3e6; color: #c9b39a; }
  .cards img, .cards i { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; background: #e9d7b8; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 1.6rem; color: #b39a80; }
  .cards b { font-size: .74rem; line-height: 1.25; margin-top: 4px; }
  .cards small { display: block; font-weight: 500; font-size: .62rem; color: var(--ink2); line-height: 1.3; margin-top: 2px; }
  .cards div.off small { color: #b39a80; }
  .rec-tabs button { font-size: .8rem; padding: 5px 2px; }
  .zukan div.off small { color: #b39a80; }
  .a2hs { border: 2px dashed var(--line); border-radius: 12px; padding: 8px 10px; margin: 8px 0; font-size: .82rem; text-align: left; background: #fff; line-height: 1.5; }
  .a2hs .row { margin-top: 6px; }
  /* ランキング */
  .rank { width: 100%; border-collapse: separate; border-spacing: 0 4px; margin: 6px 0; font-weight: 800; font-size: .84rem; text-align: left; }
  .rank td { background: #fff; padding: 5px 6px; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); vertical-align: middle; line-height: 1.25; }
  .rank td:first-child { border-left: 2px solid var(--line); border-radius: 10px 0 0 10px; }
  .rank td:last-child { border-right: 2px solid var(--line); border-radius: 0 10px 10px 0; }
  .rank td small { display: block; font-size: .68rem; color: var(--ink2); }
  .rank .no { width: 28px; text-align: center; color: var(--org-d); font-size: 1rem; }
  .rank .yen { color: var(--red-d); white-space: nowrap; }
  .rank .dt { color: var(--ink2); font-size: .72rem; white-space: nowrap; text-align: right; }
  .rank tr.now td { background: #fff0dc; border-color: var(--org); }
  .rank-in { color: var(--org-d) !important; }
  /* 隅のバージョンとリンク */
  .ver { margin: 8px 0 -4px; text-align: right; font-size: .7rem; font-weight: 500; color: var(--ink2); }
  .ver a { color: var(--teal-d); font-weight: 800; }
  .rank .nm-c { word-break: break-all; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 6px; }
  .tabs button { flex: 1; font: inherit; font-weight: 800; font-size: .9rem; color: var(--ink2); background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 5px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { color: #fff; background: var(--teal); border-color: var(--teal); }
  .online { border: 2px dashed var(--line); border-radius: 14px; padding: 4px 8px; margin: 6px 0; }
  .nm { flex: 1; min-width: 0; font: inherit; font-size: 16px; font-weight: 800; color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; background: #fff; user-select: text; -webkit-user-select: text; }
  .nm-err { color: var(--red-d); font-size: .78rem; font-weight: 800; margin: 0; min-height: 1em; }
  .btn:focus-visible, .cats button:focus-visible, #pad button:focus-visible, #bSnd:focus-visible, #bPause:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }

  /* 下段の操作ボタン */
  #pad { display: grid; grid-template-columns: 1fr 1fr .9fr 1.15fr 1.15fr; gap: 6px; margin-top: 10px; }
  #pad button {
    --c: var(--brn); --s: var(--brn-d);
    height: 68px; border: 0; border-radius: 18px; background: var(--c); color: #fff;
    font: inherit; font-weight: 800; font-size: .74rem; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    box-shadow: 0 5px 0 var(--s); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer;
  }
  #pad button svg { width: 28px; height: 28px; }
  /* PC向けのキー表示：マウス環境（細かいポインタ＋ホバーあり）のときだけ、ボタンの隅とタイトル画面に出す */
  #pad button { position: relative; }
  #pad button .kb, .keys { display: none; }
  @media (hover: hover) and (pointer: fine) {
    #pad button .kb { display: block; position: absolute; top: 5px; right: 7px; font-size: .62rem; font-weight: 800; line-height: 1; padding: 3px 5px; border-radius: 6px; background: rgba(0,0,0,.28); color: #fff; letter-spacing: .02em; }
    body.swap #pad button .kb { right: auto; left: 7px; }
    .keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 10px; margin: 8px 0 2px; font-size: .74rem; font-weight: 800; color: var(--ink2); }
  }
  .keys kbd { display: inline-block; min-width: 1.5em; padding: 1px 6px; margin-right: 3px; border: 2px solid var(--line); border-bottom-width: 3px; border-radius: 7px; background: #fff; color: var(--ink); font: inherit; font-size: .72rem; line-height: 1.5; text-align: center; }
  /* 初回のタイトル画面（まだ1回も遊んでいない）：ネコ1匹と「あそぶ」だけ */
  .first-cat { display: flex; flex-direction: column; align-items: center; margin: 10px 0 6px; }
  .first-cat canvas { width: 180px; height: 135px; }
  .first-cat b { font-size: 1.05rem; line-height: 1.3; }

const worldCaches = {};
async function fetchWorld(force, coll) {
